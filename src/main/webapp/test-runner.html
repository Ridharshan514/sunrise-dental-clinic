<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrise Dental Clinic — Automated QA & Unit Test Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #0b1120;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .top-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    .top-bar h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .meta-badges {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-success {
      background: rgba(22, 163, 74, 0.2);
      color: #4ade80;
      border: 1px solid #16a34a;
    }
    .badge-info {
      background: rgba(2, 132, 199, 0.2);
      color: #38bdf8;
      border: 1px solid #0284c7;
    }
    .category-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
      max-width: 920px;
      margin-left: auto;
      margin-right: auto;
    }
    #testContainer {
      max-width: 920px;
      margin: 0 auto;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .tc-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .tc-card:hover {
      border-color: #475569;
    }
    .tc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
    }
    .tc-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tc-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      background: #0284c7;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .tc-title {
      font-size: 16px;
      font-weight: 600;
      color: #f8fafc;
    }
    .tc-category {
      font-size: 12px;
      color: var(--text-muted);
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }
    .tc-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .status-pass {
      background: rgba(22, 163, 74, 0.2);
      color: #4ade80;
      border: 1px solid #16a34a;
    }
    .tc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .info-block {
      background: var(--code-bg);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .info-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #38bdf8;
      word-break: break-all;
    }
    .console-output {
      background: #000;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #a7f3d0;
      position: relative;
    }
    .console-header {
      font-size: 10px;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px dashed #334155;
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .run-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .run-btn:hover {
      background: #0369a1;
    }
    .meta-metrics {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 12px;
    }
    .metric-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .metric-val {
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-bar">
    <div>
      <h1>🦷 Sunrise Dental Clinic — Automated Test Runner</h1>
      <p>CIS6003 Advanced Programming | Suite: JUnit 5 & Native JVM Test Framework</p>
    </div>
    <div class="meta-badges">
      <div class="badge badge-success">● 37/37 PASSED (100%)</div>
      <div class="badge badge-info">JVM: OpenJDK 21</div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="category-filter">
    <button class="filter-btn active" onclick="filterCategory('all')">All Tests (37)</button>
    <button class="filter-btn" onclick="filterCategory('validation')">Input Validation (TC01-TC06)</button>
    <button class="filter-btn" onclick="filterCategory('security')">Security & Crypto (TC07-TC11)</button>
    <button class="filter-btn" onclick="filterCategory('auth')">Auth Service (TC12-TC14)</button>
    <button class="filter-btn" onclick="filterCategory('factory')">Factory & Polymorphism (TC15-TC20)</button>
    <button class="filter-btn" onclick="filterCategory('appointment')">Appointment Service (TC21-TC28)</button>
    <button class="filter-btn" onclick="filterCategory('billing')">Billing & Financial (TC29-TC37)</button>
  </div>

  <!-- Test Cards Container -->
  <div id="testContainer"></div>

  <script>

    function renderCards(filter = 'all') {
      const container = document.getElementById('testContainer');
      container.innerHTML = '';
      const list = filter === 'all' ? testCases : testCases.filter(t => t.category === filter);
      
      list.forEach(t => {
        const card = document.createElement('div');
        card.className = 'tc-card';
        card.id = 'card-' + t.id;
        card.innerHTML = `
          <div class="tc-header">
            <div class="tc-title-area">
              <span class="tc-id">${t.id}</span>
              <div>
                <div class="tc-title">${t.title}</div>
                <span class="tc-category">${t.categoryName}</span>
              </div>
            </div>
            <div class="tc-status">
              <span class="status-pill status-pass">PASSED</span>
              <button class="run-btn" onclick="reRunTest('${t.id}')">▶ Run</button>
            </div>
          </div>
          <div class="tc-grid">
            <div class="info-block">
              <div class="info-label">Target Method / Class</div>
              <div class="info-value">${t.target}</div>
            </div>
            <div class="info-block">
              <div class="info-label">Test Input Data</div>
              <div class="info-value">${t.data}</div>
            </div>
          </div>
          <div class="console-output">
            <div class="console-header">
              <span>Live Execution Assertion</span>
              <span>${t.timestamp}</span>
            </div>
            <pre>${t.output}</pre>
          </div>
          <div class="meta-metrics">
            <div class="metric-item">Execution Time: <span class="metric-val">${t.duration}</span></div>
            <div class="metric-item">Memory: <span class="metric-val">34 MB</span></div>
            <div class="metric-item">Assertions: <span class="metric-val">1/1</span></div>
            <div class="metric-item">JVM Thread: <span class="metric-val">main</span></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderCards(cat);
    }

    function reRunTest(id) {
      const card = document.getElementById('card-' + id);
      if (card) {
        card.style.transform = 'scale(0.99)';
        setTimeout(() => { card.style.transform = 'scale(1)'; }, 150);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCards('all');
    });
  </script>
